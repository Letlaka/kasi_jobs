{% extends "allauth/layouts/base.html" %} {% load i18n crispy_forms_tags %}
{% block authentication %}
<h1 class="h3 mb-4">{% trans "Create an account" %}</h1>

<form method="post" action="{{ action_url|default:request.path }}">
    {% csrf_token %} {{ form|crispy }}

    <div class="d-grid">
        <button type="submit" class="btn btn-primary">{% trans "Sign up" %}</button>
    </div>
</form>

<p class="mt-3">
    <a href="{% url 'account_login' %}">{% trans "Already have an account? Sign in" %}</a>
</p>

{% endblock %}

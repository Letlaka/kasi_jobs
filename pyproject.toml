[project]
name = "kasi-jobs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6.0",
    "crispy-bootstrap5>=2025.6",
    "django>=5.2.9",
    "django-allauth[mfa]>=65.13.1",
    "django-auditlog>=3.3.0",
    "django-crispy-forms>=2.5",
    "django-environ>=0.12.0",
    "dj-database-url>=3.0.1",
    "django-filter>=25.2",
    "django-prometheus>=2.4.1",
    "django-simple-history>=3.10.1",
    "django-structlog>=10.0.0",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.29.0",
    "markdown>=3.10",
    "psycopg[binary]>=3.3.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "django-countries>=8.2.0",
    "django-phonenumber-field[phonenumberslite]>=8.4.0",
    "django-fernet-fields>=0.6",
    "python-json-logger>=4.0.0",
    "structlog>=25.5.0",
    "redis>=6.4.0",
    "pillow>=12.0.0",
    "tqdm>=4.67.1",
    "whitenoise>=6.11.0",
    "django-redis>=6.0.0",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "django-axes>=8.0.0",
    "django-ipware>=7.0.1",
    "ms-active-directory>=1.14.1",
    "defusedxml>=0.7.1",
    "phonenumbers>=9.0.22",
    "pytest-django>=4.11.1",
]

[[project.authors]]
name = "Letlaka"
email = "letlaka.t@gmail.com"


[project.license]
text = "MIT"


[dependency-groups]
dev = [
"django-stubs[compatible-mypy]>=5.2.8",
"django-types>=0.22.0",
"celery-types>=0.23.0",
"django-filter-stubs>=0.1.3",
"django-stubs-ext>=5.2.7",
"djangorestframework-stubs[compatible-mypy]>=3.16.5",
"djhtml>=3.0.10",
"mypy>=1.19.1",
"pre-commit>=4.5.1",
"ruff>=0.14.9",
"types-redis>=4.6.0.20241004",
"types-openpyxl>=3.1.5.20250919",
"mypy-extensions>=1.1.0"
]


[tool.mypy]
python_version = "3.13"
plugins = [ "mypy_django_plugin.main", "mypy_drf_plugin.main" ]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true
exclude = """
(?x)
(
\t\t(^|/)migrations(/|$)    # exclude any migrations directory
\t| (^|/)\\.venv(/|$)       # exclude .venv directories
\t| (^|/)venv(/|$)          # exclude venv directories
)
"""


[tool.django-stubs]
django_settings_module = "config.mypy_settings"
ignore_missing_settings = true
ignore_missing_model_attributes = true


[tool.ruff]
line-length = 100
target-version = "py313"
fix = true
src = [ "core", "accounts", "utilities" ]
extend-exclude = [ "**/migrations/**", "**/.venv/**", "pyproject.toml" ]
force-exclude = true


[tool.ruff.lint]
select = [
"W",
"C",
"E",
"F",
"I",
"UP",
"B",
"BLE",
"C4",
"C90",
"T20",
"SIM",
"N",
"Q",
"RUF",
"ASYNC",
"S",
"PTH",
"ERA",
"PL",
"PERF",
"ANN",
"ARG",
"FBT",
"RET",
"TCH"
]
ignore = [ "E203" ]


[tool.ruff.lint.isort]
known-first-party = [ "core", "accounts", "utilities" ]
combine-as-imports = true


[tool.ruff.format]
line-ending = "lf"
